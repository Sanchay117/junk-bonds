[package]
name = "junk-bonds"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Junk Bonds: a raccoon auction house on NEAR where the trash pays yield"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
